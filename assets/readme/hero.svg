<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">lubi-web · HP-Patience</title>
  <desc id="desc">Lubi 时间记录 Web 版：结构（monorepo）；复用（1 套引擎）；状态（未部署）。</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect width="1200" height="400" rx="24" fill="#0e1116"/>

  <g id="title-block" transform="translate(64 0)">
    <text class="mono" x="0" y="92" font-size="18" fill="#8b93a1">HP-Patience / lubi-web</text>
    <text class="sans" x="-4" y="182" font-size="92" font-weight="800" fill="#f4f1ea" letter-spacing="-2">lubi-web</text>
    <text class="sans" x="0" y="234" font-size="30" font-weight="600" fill="#f4f1ea">Lubi 时间记录 Web 版</text>
    <text class="sans" x="0" y="276" font-size="20" fill="#b7bdc8">把 Obsidian 插件搬到浏览器</text>
    <text class="sans" x="0" y="306" font-size="20" fill="#b7bdc8">monorepo：apps + packages</text>
    <text class="mono" x="0" y="350" font-size="18" fill="#8b93a1">8 commits · monorepo · JavaScript</text>
  </g>

  <g id="panels" class="mono" font-size="16">
    <g transform="translate(520 56)">
      <rect width="624" height="88" rx="12" fill="#161a21" stroke="#262c36"/>
      <rect width="6" height="88" rx="3" fill="#ff7a59"/>
      <text class="sans" x="26" y="40" font-size="22" font-weight="700" fill="#f4f1ea">结构</text>
      <text x="26" y="68" fill="#8b93a1">monorepo</text>
<text x="168" y="38" fill="#d9dde4"><tspan fill="#ff7a59">●</tspan> apps 应用   <tspan fill="#ff7a59">●</tspan> packages 共享包</text>
<text x="168" y="68" fill="#d9dde4"></text>
    </g>
    <g transform="translate(520 160)">
      <rect width="624" height="88" rx="12" fill="#161a21" stroke="#262c36"/>
      <rect width="6" height="88" rx="3" fill="#3ec6b0"/>
      <text class="sans" x="26" y="40" font-size="22" font-weight="700" fill="#f4f1ea">复用</text>
      <text x="26" y="68" fill="#8b93a1">1 套引擎</text>
<text x="168" y="38" fill="#d9dde4"><tspan fill="#3ec6b0">●</tspan> Lubi 1.8.0 业务引擎</text>
<text x="168" y="68" fill="#d9dde4"><tspan fill="#5b6370">○</tspan> schema v14</text>
    </g>
    <g transform="translate(520 264)">
      <rect width="624" height="88" rx="12" fill="#161a21" stroke="#262c36"/>
      <rect width="6" height="88" rx="3" fill="#f2c14e"/>
      <text class="sans" x="26" y="40" font-size="22" font-weight="700" fill="#f4f1ea">状态</text>
      <text x="26" y="68" fill="#8b93a1">未部署</text>
<text x="168" y="38" fill="#d9dde4"><tspan fill="#f2c14e">●</tspan> 仅供审核</text>
<text x="168" y="68" fill="#d9dde4"></text>
    </g>
