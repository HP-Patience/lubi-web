<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Lubi Web — 柳比歇夫时间记录的 Web 版</title>
  <desc id="desc">左侧为仓库名与说明：复用 Obsidian 插件的业务引擎与 schema v14，只替换宿主。右侧为一天的真实用时记录卡：08:30–11:00 线性代数第 4 章 2.5h、13:10–13:40 单词复习 30min、13:45–14:00 回复导师邮件 15min、16:00–17:00 英语听力 1h，本人记录 11.2h。</desc>

  <rect width="1200" height="400" rx="24" fill="#0F1012"/>

  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7E848D">HP-PATIENCE / LUBI-WEB</text>
    <text x="-3" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="84" font-weight="800" fill="#F3F1EC" letter-spacing="-2">Lubi Web</text>
    <text x="0" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="26" font-weight="600" fill="#F3F1EC">柳比歇夫时间记录的 Web 版</text>
    <text x="0" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="20" fill="#A6ACB5">复用 Obsidian 插件的引擎，只替换宿主</text>
    <text x="0" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="20" fill="#A6ACB5">界面精简，功能、数据与安全边界不变</text>
    <text x="0" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#6F757E">monorepo · Node 24+ · schema v14</text>
  </g>

  <g id="day-record">
    <rect x="616" y="44" width="520" height="312" rx="16" fill="#15161A" stroke="#262A30"/>
    <text x="644" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#7E848D">我的用时 · 2026-10-18</text>
    <text x="1108" y="88" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#D9A34C">11.2h</text>
    <line x1="644" y1="106" x2="1108" y2="106" stroke="#262A30"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#7E848D">
      <text x="644" y="144">08:30–11:00</text>
      <text x="644" y="188">13:10–13:40</text>
      <text x="644" y="232">13:45–14:00</text>
      <text x="644" y="276">16:00–17:00</text>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="20" fill="#F3F1EC">
      <text x="792" y="144">线性代数 第 4 章</text>
      <text x="792" y="188">单词复习</text>
      <text x="792" y="232">回复导师邮件</text>
      <text x="792" y="276">英语听力</text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#A6ACB5" text-anchor="end">
      <text x="1108" y="144">2.5h</text>
      <text x="1108" y="188">30min</text>
      <text x="1108" y="232">15min</text>
      <text x="1108" y="276">1h</text>
    </g>

    <line x1="644" y1="300" x2="1108" y2="300" stroke="#262A30"/>
    <text x="644" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#7E848D">当天待做 5 · 待确认 1 · 后台 0</text>
  </g>
</svg>
